---
- name: configure redis database
  hosts: redis
  become: yes

  tasks:
    - name: enable redis 7 version
      command: dnf module enable redis:7 -y

    - name: install redis
      package:
        name: redis
        state: present
    
    - name: enable and start the service
      service:
        name: redis
        state: started
        enabled: yes

    - name: allow remote connection
      replace:
        path: /etc/redis/redis.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'

    - name: modify a sentence
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^#?protected-mode yes'
        line: 'protected-mode no'

    - name: restart the service
      service:
        name: redis
        state: restarted