---
- name: configure catalogue server
  hosts: catalogue
  become: yes

  tasks:
    - name: disable default nodejs
      command: dnf module disable nodejs -y

    - name: enable nodejs24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:
        name: nodejs
        state: present

    - name: create application user
      user:
        name: roboshop
        create_home: false
        home: /app
        shell: /sbin/nologin
        system: true
        comment: "roboshop system user"

    - name: delete the /app directory
      file: 
        path: /app
        state: absent

    - name: delete the catalogue.zip file
      file:
        path: /tmp/catalogue.zip
        state: absent

    - name: create the /app directory
      file:
        path: /app
        state: directory

    - name: download the application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip

    - name: unzip the application
      unarchive: 
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes
        
    - name: installing the dependencies
      community.general.npm:
        name: npm
        path: /app

    - name: copy the catalogue service
      template: 
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service

    - name: copy mongo repo
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: install mongodb client
      dnf: 
        name: mongodb-mongosh
        state: present 

    - name: check if the data is loaded
      command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count

    - name: print the product countDocuments
      debug:
        msg: "{{ product_count.stdout }}"

    - name: load the products
      shell: mongosh --host "{{ mongodb_host }}" </app/db/master-data.js
      when: product_count | int == 0

    - name: daemon-reload
      systemd_service:
        daemon_repload: true

    - name: start and enable the service
      service:
        name: catalogue
        state: started
        enabled: yes
