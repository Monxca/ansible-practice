---
- name: Variables from precedence
  hosts: local
  connection: local

  #vars:
   # course: "ansible from play"
  
  
  
  vars_files:
    - course.yaml

  vars_prompt:
    - name: course
      prompt: What is the name of the course?
      private: false

  tasks:
    - name: Print course information
      #vars:
       # course: "ansible from task"
      debug:
        msg: Hi, I am learning {{ course }}