---
- name: Multiple conditions with AND OR
  hosts: local

  tasks:
    - name: Checking with AND
      debug:
        msg: Both the conditions are true
      when: ansible_facts['os_family'] == "RedHat" AND ansible_facts['os_family'] == "Debian"

    - name: Checking with OR
      debug:
        msg: Atleast one condition is true
      when: ansible_facts['os_family'] == "RedHat" OR ansible_facts['os_family'] == "Debian"