---
- name: create a new user if it doesn't exist
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: check if the user exists
      command: id roboshop
      register: user_output
      ignore_errors: true

    - name: print the user output
      debug:
        msg: "{{ user_output }}"

    - name: create the user when it doesn't exist
      command: useradd roboshop
      when: user_output != 0