---
- name: Learning the register module
  hosts: local
  connection: local

  tasks:
    - name: store the output in variable
      command: cat /etc/os-release
      register: os_info

    - name: pasting the output
      debug:
        msg: "{{ os_info.stdout }}"

    - name: checking for error code
      debug:
        msg: No error code found
      when: os_info.rc == 0