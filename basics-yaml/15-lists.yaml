---
- name: Listing the items
  hosts: local
  connection: local

  vars:
    aws_regions:
    - us-east-1a
    - us-east-2a
    - us-east-3a

  tasks:
    - name: Print the first item
      debug:
        msg: "{{ aws_regions[0] }}"

    - name: Print the third item
      debug:
        msg: "{{ aws_regions[2] }}"

    - name: Print the second item
      debug:
        msg: "{{ aws_regions[1] }}"