---
- name: Conditional statements
  hosts: local
  connection: local

  vars_prompt:
    number: Write the number here?

  tasks:
    - name: even 
      debug:
        msg: "Given number : {{ number }} is even"
      when: given_number % 2 == 0

    - name: odd
      debug:
        msg: "Given number : {{ number }} is odd"
      when: given_number % 2 != 0