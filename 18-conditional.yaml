---
- name: Conditional statements
  hosts: local
  connection: local

  vars_prompt:
    - name: number
      prompt: Type the number to check whether it is even or odd
      private: false

  tasks:
    - name: even 
      debug:
        msg: "Given number : {{ number }} is even"
      when: number % 2 == 0

    - name: odd
      debug:
        msg: "Given number : {{ number }} is odd"
      when: number % 2 != 0